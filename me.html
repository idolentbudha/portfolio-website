<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio website of Buddha Lama, showcasing skills, projects, and contact details."
    />
    <script
      src="https://kit.fontawesome.com/1fe592cdea.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" type="text/css" href="stylesheet/v2/style.css" />
    <title>Me</title>
    <script>
      function collaspseTechCard(element) {
        const techType = element.getAttribute("data-stack");

        const techCards = document.getElementsByClassName("tech-card");

        for (let i = 0; i < techCards.length; i++) {
          if (techCards[i].getAttribute("data-stack") !== techType) {
            techCards[i].classList.remove("active");
            techCards[i]
              .getElementsByClassName("tech-items-container")[0]
              .classList.remove("active");
          }
        }
        element
          .getElementsByClassName("tech-items-container")[0]
          .classList.add("active");
        element.classList.add("active");
      }
    </script>
  </head>
  <body>
    <nav id="Nav">
      <ul>
        <li><a href="#Home" title="Go to Home section">Home</a></li>
        <li><a href="#About" title="Go to About section">About</a></li>
        <li><a href="#Projects" title="Go to Projects section">Projects</a></li>
      </ul>
      <div class="nav-quicklink-container">
        <!-- <button class="nav-btn" aria-label="Toggle dark mode">
          <i class="fa-brands fa-linkedin"></i>
        </button>
        <button class="nav-btn" aria-label="Toggle dark mode">
          <i class="fa-solid fa-envelope"></i>
        </button> -->
        <button class="dark-mode-btn" aria-label="Toggle dark mode">
          <i class="fa-regular fa-lightbulb"></i>
        </button>
      </div>
    </nav>
    <main>
      <section id="Home">
        <div id="HomeHeader" class="homeheader-div-container">
          <p class="homeheader-p bold">
            <br />
            <span id="name">I'm Buddha.</span
            ><span id="wave-emoji" role="img" aria-label="waving hand">👋</span>
            <br />
            Fullstack Developer, crafting solutions for 5+ years.
            <br />
            Welcome to my portfolio website.
          </p>
          <div class="home-subheader-container">
            <!-- <div>
              <i class="fa-solid fa-briefcase"></i>
              <p><strong>Recent Experience</strong></p>
              <p>Web developer @ The Tech Academy</p>
            </div> -->
            <div>
              <!-- <p><strong>Location</strong></p> -->
              <p><i class="fa-solid fa-location-dot"></i>London, UK</p>
            </div>
          </div>
        </div>
      </section>

      <section id="Projects">
        <!-- <h3><i class="fa-solid fa-briefcase"></i>&nbsp; Projects</h3> -->
        <div id="ProjectsContainer" class="project-container card">
          <button onclick="prevSlide()" class="carousel-btn carousel-btn-prev">
            <img src="images/prev.svg" alt="Previous Button" />
          </button>
          <button onclick="nextSlide()" class="carousel-btn carousel-btn-next">
            <img src="images/next.svg" alt="Next Button" />
          </button>
          <div class="projectimg-container">
            <div class="projectimg-div active">
              <img
                src="images/projects/v2/danphecare-ss.jpg"
                alt="Screenshot of D-Care project"
              />
            </div>
            <div class="projectimg-div">
              <img
                src="images/projects/v2/icard-ss.jpg"
                alt="Screenshot of I-Card project"
              />
            </div>
            <div class="projectimg-div">
              <img
                src="images/projects/v2/ramailogames-ss.jpg"
                alt="Screenshot of RGames project"
              />
            </div>
          </div>
        </div>
      </section>
      <section id="About">
        <h2>SKILLS</h2>
        <div class="about-div-container">
          <div
            data-stack="mobile"
            class="card tech-card"
            onclick="collaspseTechCard(this)"
          >
            <div class="techheader-div-container">

                <img

          </div>
          <div
            data-stack="cloud"
            class="card tech-card"
            onclick="collaspseTechCard(this)"
          >

              <h2>

            </div>
            <div class="tech-items-container">
              <div class="tech-items">
                <img
                  src="images/icons/AWS.png"
                  alt="HTML5 Logo"
                  class="tech-logo"
                />
                <img
                  src="images/icons/aws-EC2.png"
                  alt="EC2 logo"
                  class="tech-logo"
                />
                <img
                  src="images/icons/aws-Route53.png"
                  alt="Route 53 logo"
                  class="tech-logo"
                />
                <img
                  src="images/icons/aws-s3.png"
                  alt="S3 logo"
                  class="tech-logo"
                />
                <img
                  src="images/icons/aws-CodeDeploy.png"
                  alt="Code Deploy logo"
                  class="tech-logo"
                />
              </div>
            </div>
          </div>
          <div
            data-stack="web"
            class="card tech-card active"
            onclick="collaspseTechCard(this)"
          >
            <div class="techheader-div-container">
              <h2>
                <i class="fa-solid fa-earth-americas"></i>
              </h2>
            </div>
            <div class="tech-items-container">
              <div class="tech-items">
                <img
                  src="images/icons/HTML5.png"
                  alt="HTML5 Logo"
                  class="tech-logo"
                />
                <img
                  src="images/icons/CSS3.png"
                  alt="CSS3 Logo"
                  class="tech-logo"
                />
                <img
                  src="images/icons/JavaScript.png"
                  alt="JavaScript Logo"
                  class="tech-logo"
                />
                <img
                  src="images/icons/bootstrap.png"
                  alt="Bootstrap Logo"
                  class="tech-logo"
                />

      </section>
      <section id="Contact">
        <div class="contact-header">
          <h2>Get In Touch</h2>
        </div>
        <div class="contact-div-container">
          <form>
            <div class="form-group">
              <label for="name">Name:</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
              <label for="message">Message:</label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit">Send</button>
          </form>
        </div>
        <div class="social-icons">
          <a href="https://www.instagram.com/idolentbudha/">
            <img src="images/icons/GitHub.png" alt="Github icon" />
          </a>
          <a href="https://www.linkedin.com/in/lamabuddha/">
            <img src="images/icons/LinkedIn.png" alt="LinkedIn icon" />
          </a>
        </div>
      </section>
    </main>
    <script>
      const toggleBtn = document.querySelector(".dark-mode-btn");
      const currentTheme = localStorage.getItem("theme");

      if (currentTheme === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }

      toggleBtn.addEventListener("click", () => {
        const theme = document.documentElement.getAttribute("data-theme");
        if (theme === "light") {
          document.documentElement.removeAttribute("data-theme");
          localStorage.setItem("theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
        }
      });

      let currentIndex = 0;
      const slides = document.querySelectorAll(".projectimg-div");

      function showSlide(index) {
        slides.forEach((slide, i) => {
          if (i == index) {
            slide.classList.add("active");
          } else {
            slide.classList.remove("active");
          }
        });
      }

      function nextSlide() {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(currentIndex);
      }

      function prevSlide() {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        showSlide(currentIndex);
      }

      // Show the first slide on load
      showSlide(currentIndex);

      const NavSection = document.getElementById("Nav");
      const homeheaderContainer = document.querySelector("#HomeHeader");

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) {
              homeheaderContainer.classList.add("is-pinned");
            } else {
              homeheaderContainer.classList.remove("is-pinned");
            }
          });
        },
        { threshold: 0.4 }
      );

      observer.observe(NavSection);

      const HomeSection = document.getElementById("Home");
      const observer2 = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            console.log("observer2: ", entry);
            if (!entry.isIntersecting) {
              homeheaderContainer.classList.add("fade-out");
            } else {
              homeheaderContainer.classList.remove("fade-out");
            }
          });
        },
        { threshold: 0.5 }
      );

      observer2.observe(HomeSection);

      window.onload = function () {
        console.log("loaded");
        document.getElementById("name").classList.add("anim-in");

        setTimeout(function () {
          // This code will run after the specified delay
          document.getElementById("wave-emoji").classList.add("anim-in");
        }, 550);
      };
    </script>
  </body>
</html>
